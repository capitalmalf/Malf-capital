<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Malf Capital</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0078d4">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:20px}
.container{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1,h2,h3{margin-bottom:15px}
input,select,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px}
button{background:#0078d4;color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer}
button:hover{background:#005ea6}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#6b7280}
table{width:100%;border-collapse:collapse;margin-top:15px}
table th{background:#0078d4;color:#fff}
th,td{border:1px solid #ddd;padding:10px}
.timeline-item{margin-bottom:10px;border-left:5px solid #0078d4;padding:10px;background:#f9f9f9;border-radius:8px}
.timeline-whatsapp{border-left-color:#25D366}
.timeline-ligacao{border-left-color:#0ea5e9}
.timeline-email{border-left-color:#f97316}
.timeline-presencial{border-left-color:#8b5cf6}
.hidden{display:none}
.card-resumo{background:#eff6ff;padding:15px;border-radius:10px;font-size:18px;font-weight:bold;color:#0078d4;margin-top:10px}
.documento{background:#f5f5f5;padding:8px;margin-bottom:5px;border-radius:5px}
.documento a{color:#0078d4;text-decoration:none}
#login{max-width:380px;margin:60px auto}
#erroLogin{color:#c00;margin-bottom:10px}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.topo h1{margin:0}
.det-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.det-topo h2{margin:0 0 8px}
.det-acoes{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:bold}
.st-neg{background:#fef3c7;color:#92400e}
.st-fechado{background:#dcfce7;color:#166534}
.st-acomp{background:#dbeafe;color:#1e40af}
.st-enc{background:#e5e7eb;color:#374151}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.campo small{display:block;color:#6b7280;font-size:12px;margin-bottom:3px}
.campo span{font-size:16px;word-break:break-word}
.campo.valor span{font-size:22px;font-weight:bold;color:#0078d4}
.obs{background:#f9fafb;border-radius:8px;padding:12px;white-space:pre-wrap}
.secao{margin-top:24px;padding-top:20px;border-top:1px solid #e5e7eb}
.secao h3{margin-bottom:12px}
.novo-comentario{background:#f9fafb;border-radius:10px;padding:15px;margin-bottom:20px}
.novo-comentario button{margin-top:0}
.timeline-item .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:#6b7280;margin-bottom:6px}
.timeline-item .tipo{font-weight:bold;color:#111}
.vazio{color:#6b7280}
.link-btn{display:inline-block;padding:10px 15px;border-radius:8px;background:#fff;color:#0078d4;border:1px solid #0078d4;text-decoration:none;font-size:14px;text-align:center}
.documento a{display:block}
td .link-btn{margin-right:4px}
@media(max-width:768px){td .link-btn{display:block;margin:5px 0 0}}
@media(max-width:768px){.link-btn{flex:1 1 100%}}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.filtros input{flex:2 1 260px;margin:0}
.filtros select{flex:1 1 180px;margin:0}
.so-mobile{display:none}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.res{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;border:2px solid transparent}
.res.ativo{border-color:#0078d4}
.res small{color:#6b7280;display:block;margin-bottom:4px}
.res b{font-size:20px;display:block;color:#0078d4}
.res span{font-size:13px;color:#374151}
.alerta{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:12px 15px;border-radius:10px;margin-bottom:20px}
.alerta a{color:#9a3412;font-weight:bold}
th.ord{cursor:pointer;user-select:none}
.linha{cursor:pointer}
.linha:hover{background:#f5f9ff}
.nome-link{color:#111;font-weight:bold;text-decoration:none}
.sub{font-size:12px;color:#6b7280}
.atraso{color:#c2410c;font-weight:bold}
.muito{color:#b91c1c;font-weight:bold}
.icone{padding:8px 11px;margin:0}
.perigo{background:#dc2626}
.perigo:hover{background:#b91c1c}
td.acoes{white-space:nowrap}
td.acoes .perigo{margin-left:18px}
#contagem{margin:12px 0 0}
#btnMais{margin-top:15px}
@media(max-width:768px){.icone{width:auto}.so-mobile{display:block}.filtros button{width:100%}}
#cnpjInfo,#dicaReceita{margin:-4px 0 12px}
#cnpjInfo:empty,#dicaReceita:empty{display:none}
#dicaReceita{background:#eff6ff;color:#1e40af;padding:10px 12px;border-radius:8px;font-size:13px;margin:0 0 18px}
.menu{display:flex;gap:8px;margin-bottom:20px}
.menu button{background:#fff;color:#0078d4;border:1px solid #0078d4}
.menu button.ativo{background:#0078d4;color:#fff}
@media(max-width:768px){
table,thead,tbody,th,td,tr{display:block}
thead{display:none}
tr{margin-bottom:15px;border:1px solid #ddd;border-radius:10px;background:#fff;padding:10px}
td{border:none;padding:5px}
button{width:100%;margin-top:5px}
.topo button{width:auto}
}

/* ---- Formulário e mobile ---- */
input,select,textarea{font:inherit;font-size:16px;min-height:44px;min-width:0;max-width:100%;background:#fff;color:#111}
textarea{min-height:96px;resize:vertical}
input[type=date]{appearance:none;-webkit-appearance:none}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0078d4;box-shadow:0 0 0 3px rgba(0,120,212,.18)}
input.invalido,select.invalido,textarea.invalido{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.12)}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:6px;color:#374151}
fieldset{border:none;margin:0 0 8px;min-width:0}
legend{font-weight:bold;font-size:17px;margin-bottom:12px;padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.g2 .full{grid-column:1/-1}
.f{margin-bottom:14px;min-width:0}
.f input,.f select,.f textarea{margin-bottom:0}
.f #cnpjInfo{margin:6px 0 0}
.erro{color:#b91c1c;font-size:13px;margin-top:5px}
.erro:empty{display:none}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:normal;margin:4px 0 0}
.check input{width:20px;height:20px;min-height:0;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{width:auto;margin:0;padding:8px 14px;font-size:14px;background:#eff6ff;color:#0078d4;border:1px solid #bfdbfe}
.zona{display:block;border:2px dashed #93c5fd;border-radius:10px;padding:22px 14px;text-align:center;color:#1e40af;background:#f8fbff;cursor:pointer;margin:0;font-weight:normal}
.zona.sobre{background:#dbeafe}
.arq{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f5f5f5;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.arq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.arq button{width:auto;margin:0;padding:4px 12px;background:#dc2626;flex:none;min-height:36px}
.progresso{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}
#barraIn{height:100%;width:0;background:#0078d4;transition:width .2s}
.barra-acoes{display:flex;gap:10px;margin-top:10px}
.barra-acoes button{margin:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#b91c1c}
@media(max-width:768px){
body{padding:12px}
.container{padding:16px}
.g2{grid-template-columns:1fr}
button{min-height:44px}
.menu button{flex:1;margin:0}
.barra-acoes{position:sticky;bottom:0;background:#fff;margin:12px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.08);border-radius:0 0 12px 12px;z-index:5}
.barra-acoes button{flex:1;width:auto;margin:0}
.barra-acoes #btnSalvar{flex:2}
.resumo{grid-template-columns:1fr 1fr}
.resumo .res:first-child{grid-column:1/-1}
td[data-label]{display:flex;justify-content:space-between;align-items:center;gap:10px}
td[data-label]::before{content:attr(data-label);color:#6b7280;font-size:13px}
td.acoes{display:flex;gap:10px}
td.acoes button{flex:1;width:auto;margin:0}
td.acoes .perigo{margin-left:0}
#login{margin:24px auto}
.toast{bottom:100px}
}

/* ---- Painel, funil, extras ---- */
.res.est{cursor:default}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.barras{display:flex;align-items:flex-end;gap:8px;height:150px}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:#374151;text-align:center}
.bcol i{display:block;width:100%;background:#0078d4;border-radius:6px 6px 0 0;min-height:2px}
.funil{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;align-items:flex-start;padding-bottom:10px}
.col{flex:0 0 min(300px,85vw);background:#fff;border-radius:12px;padding:12px;scroll-snap-align:start;box-shadow:0 2px 10px rgba(0,0,0,.08);min-height:120px}
.col h3{margin-bottom:4px}
.kcard{background:#f9fafb;border-radius:8px;padding:10px;margin-top:8px;cursor:grab}
.kcard a{color:#111;font-weight:bold;text-decoration:none}
.kcard select{margin:8px 0 0}
.wa{background:#f9fafb;border-radius:10px;padding:12px;margin-bottom:18px}
.wa summary{cursor:pointer;font-weight:bold}
.wa select,.wa textarea{margin:10px 0 0}
.menu button{font-size:14px;padding:10px 6px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="container">
  <h2>Entrar no CRM</h2>
  <input id="loginEmail" type="email" placeholder="E-mail">
  <input id="loginSenha" type="password" placeholder="Senha">
  <div id="erroLogin"></div>
  <button id="btnEntrar">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topo">
    <h1>CRM Simples</h1>
    <button class="sec" id="btnSair">Sair</button>
  </div>

  <div class="menu">
    <button id="navClientes" class="ativo" data-rota="clientes">Clientes</button>
    <button id="navPainel" data-rota="painel">Painel</button>
    <button id="navFunil" data-rota="funil">Funil</button>
    <button id="navNovo">+ Novo</button>
  </div>

  <!-- PÁGINA: NOVO CLIENTE -->
  <div id="paginaNovo" class="hidden">
  <div class="container">
    <h2 id="tituloForm">Novo Cliente</h2>

    <fieldset>
      <legend>Dados pessoais</legend>
      <div class="g2">
        <div class="f full">
          <label for="nome">Nome completo *</label>
          <input id="nome" autocomplete="off" placeholder="Ex.: Maria da Silva">
          <div class="erro" id="erro-nome"></div>
        </div>
        <div class="f">
          <label for="cpf">CPF ou CNPJ</label>
          <input id="cpf" inputmode="numeric" autocomplete="off" placeholder="Somente números">
          <div class="erro" id="erro-cpf"></div>
          <div id="cnpjInfo" class="sub"></div>
        </div>
        <div class="f">
          <label for="nascimento">Data de nascimento</label>
          <input id="nascimento" type="date">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contato</legend>
      <div class="g2">
        <div class="f">
          <label for="telefone">Telefone</label>
          <input id="telefone" type="tel" inputmode="tel" autocomplete="off" placeholder="(00) 00000-0000">
          <div class="erro" id="erro-telefone"></div>
          <label class="check"><input type="checkbox" id="whatsapp" checked> Este número tem WhatsApp</label>
        </div>
        <div class="f">
          <label for="email">E-mail</label>
          <input id="email" type="email" inputmode="email" autocapitalize="none" autocomplete="off" placeholder="nome@exemplo.com">
          <div class="erro" id="erro-email"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Negociação</legend>
      <div class="g2">
        <div class="f">
          <label for="valor">Valor negociado</label>
          <input id="valor" inputmode="numeric" autocomplete="off" placeholder="R$ 0,00">
        </div>
        <div class="f">
          <label for="status">Status</label>
          <select id="status">
            <option>Em negociação</option><option>Fechado</option>
            <option>Em acompanhamento</option><option>Encerrado</option>
          </select>
        </div>
        <div class="f full">
          <label for="proximoContato">Próximo contato (retorno)</label>
          <input id="proximoContato" type="date">
          <div class="chips">
            <button type="button" onclick="retornoRapido(1)">Amanhã</button>
            <button type="button" onclick="retornoRapido(3)">Em 3 dias</button>
            <button type="button" onclick="retornoRapido(7)">Em 1 semana</button>
            <button type="button" onclick="retornoRapido('m')">Em 1 mês</button>
            <button type="button" onclick="retornoRapido(0)">Limpar</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Observações e documentos</legend>
      <div class="f">
        <label for="observacoes">Observações gerais</label>
        <textarea id="observacoes" rows="4" placeholder="Anotações sobre o cliente"></textarea>
      </div>
      <div class="f">
        <label class="zona" id="zona" for="documentos">📎 Toque ou arraste arquivos aqui<br><small>PDF, imagens, Word ou Excel · até 10 MB cada</small></label>
        <input id="documentos" type="file" multiple class="hidden" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx">
        <div id="listaArquivos"></div>
        <div class="progresso hidden" id="barra"><div id="barraIn"></div></div>
      </div>
    </fieldset>

    <div class="barra-acoes">
      <button id="btnSalvar" onclick="salvarCliente()">Salvar cliente</button>
      <button class="sec" id="btnCancelar" onclick="cancelarEdicao()">Cancelar</button>
    </div>
  </div>
  </div>

  <!-- PÁGINA: CLIENTES -->
  <div id="paginaClientes">
  <div id="alertaRetorno" class="alerta hidden"></div>
  <div class="resumo" id="resumo"></div>
  <div class="container">
    <div class="filtros">
      <input id="busca" placeholder="Buscar por nome, CPF/CNPJ ou telefone..." oninput="resetPagina()">
      <select id="filtroStatus" onchange="resetPagina()">
        <option value="">Todos os status</option>
        <option>Em negociação</option><option>Fechado</option>
        <option>Em acompanhamento</option><option>Encerrado</option>
      </select>
      <select id="ordenacao" class="so-mobile" onchange="ordenarSel()">
        <option value="nome">Ordenar: Nome</option><option value="valor">Ordenar: Maior valor</option>
        <option value="ultimo">Ordenar: Sem contato há mais tempo</option><option value="retorno">Ordenar: Retorno</option>
      </select>
      <button class="sec" onclick="exportarCSV()">Exportar CSV</button>
      <button class="sec" onclick="exportarJSON()">Backup</button>
      <button class="sec" onclick="document.getElementById('impCsv').click()">Importar CSV</button>
      <input id="impCsv" type="file" accept=".csv" class="hidden" onchange="importarCSV(this)">
    </div>
    <div id="contagem" class="vazio"></div>
    <table>
      <thead><tr>
        <th class="ord" id="th-nome" onclick="ordenarPor('nome')">Cliente</th>
        <th>Telefone</th>
        <th class="ord" id="th-valor" onclick="ordenarPor('valor')">Valor</th>
        <th class="ord" id="th-status" onclick="ordenarPor('status')">Status</th>
        <th class="ord" id="th-ultimo" onclick="ordenarPor('ultimo')">Último contato</th>
        <th class="ord" id="th-retorno" onclick="ordenarPor('retorno')">Retorno</th>
        <th>Ações</th>
      </tr></thead>
      <tbody id="listaClientes"></tbody>
    </table>
    <button class="sec hidden" id="btnMais" onclick="mostrarMais()">Mostrar mais</button>
  </div>
  </div>

  <div id="paginaPainel" class="hidden"><div id="painelConteudo"></div></div>
  <div id="paginaFunil" class="hidden"><div id="funilConteudo" class="funil"></div></div>

  <!-- PÁGINA: DETALHES DO CLIENTE -->
  <div id="paginaCliente" class="hidden">
    <div id="detalhesCliente" class="container"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ===== COLE AQUI OS DADOS DO SEU PROJETO (Supabase > Project Settings > API) ===== */
const SUPABASE_URL = "https://apvqoqlbjubfuhxohtre.supabase.co";
const SUPABASE_KEY = "sb_publishable_RzeLqlfrlUOQ72Aig_zH5w_dKuAEfnW";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "documentos";
let usuarioEmail = "";

/* ----- Camada de dados: converte nomes (camelCase <-> snake_case) e mantém a lista local em dia ----- */
const paraSnake = k => k.replace(/[A-Z]/g, m => "_" + m.toLowerCase());
const paraCamel = k => k.replace(/_([a-z])/g, (_, l) => l.toUpperCase());
const DATAS = ["nascimento", "proximo_contato", "situacao_receita_em"];
const deRow = r => Object.fromEntries(Object.entries(r).map(([k, v]) => [paraCamel(k), v]));
const paraRow = o => Object.fromEntries(Object.entries(o).map(([k, v]) => {
  const n = paraSnake(k);
  return [n, DATAS.includes(n) && v === "" ? null : v];
}));
const arrayUnion = (...itens) => ({ __uniao: itens });
const arrayRemove = item => ({ __remover: item });
const serverTimestamp = () => undefined;
const ok = r => { if (r.error) throw new Error(r.error.message); return r.data; };

function guardar(row) {
  const n = deRow(row), i = clientes.findIndex(c => c.id === n.id);
  if (i >= 0) clientes[i] = n; else clientes.push(n);
  atualizarTelas();
}
async function criar(dados) {
  const row = ok(await sb.from("clientes").insert(paraRow(dados)).select().single());
  guardar(row);
  return { id: row.id };
}
async function atualizar(id, patch) {
  const simples = {}, chamadas = [];
  for (const [k, v] of Object.entries(patch)) {
    if (v && v.__uniao) v.__uniao.forEach(item => chamadas.push(["append_item", { p_id: id, p_campo: k, p_item: item }]));
    else if (v && v.__remover) chamadas.push(["remover_documento", { p_id: id, p_path: v.__remover.path }]);
    else if (v !== undefined) simples[k] = v;
  }
  if (Object.keys(simples).length) ok(await sb.from("clientes").update(paraRow(simples)).eq("id", id));
  for (const [fn, args] of chamadas) ok(await sb.rpc(fn, args));
  guardar(ok(await sb.from("clientes").select("*").eq("id", id).single()));
}
async function excluir(id) {
  ok(await sb.from("clientes").delete().eq("id", id));
  clientes = clientes.filter(c => c.id !== id);
  atualizarTelas();
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => Number(n || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});

const classeStatus = {"Em negociação":"st-neg","Fechado":"st-fechado","Em acompanhamento":"st-acomp","Encerrado":"st-enc"};
const badge = st => `<span class="badge ${classeStatus[st] || "st-enc"}">${esc(st)}</span>`;
const tipos = {whatsapp:"💬 WhatsApp", ligacao:"📞 Ligação", email:"✉️ E-mail", presencial:"🤝 Presencial"};

let clientes = [];
let clienteAtualId = null;
let carregado = false;
let ultimaConsulta = null;
let arquivosPend = [];
let sujo = false;
let editandoId = null;
let ordemValor = false;
let unsub = null;

/* ===== Navegação entre páginas ===== */
function rota() {
  const h = location.hash;
  const m = h.match(/^#cliente\/(.+)$/);
  const pag = m ? "Cliente" : h === "#novo" ? "Novo" : h === "#painel" ? "Painel" : h === "#funil" ? "Funil" : "Clientes";
  ["Novo", "Cliente", "Clientes", "Painel", "Funil"].forEach(n => $("pagina" + n).classList.toggle("hidden", n !== pag));
  const nav = { Clientes: "navClientes", Cliente: "navClientes", Novo: "navNovo", Painel: "navPainel", Funil: "navFunil" }[pag];

let canal = null, idAtual = null;
async function carregar() {
  const r = await sb.from("clientes").select("*");
  if (r.error) { alert("Erro ao carregar clientes: " + r.error.message); return; }
  clientes = r.data.map(deRow);

    .on("postgres_changes", { event: "*", schema: "public", table: "clientes" }, p => {

window.salvarCliente = async () => {
  limparErros();
  const doc_ = soNum($("cpf").value), tel_ = soNum($("telefone").value), mail_ = $("email").value.trim();
  let primeiro = null;
  const erro = (campo, msg) => { $("erro-" + campo).textContent = msg; $(campo).classList.add("invalido"); primeiro = primeiro || $(campo); };
  if (!$("nome").value.trim()) erro("nome", "Informe o nome do cliente.");
  if (doc_ && !(doc_.length === 11 ? cpfOk(doc_) : doc_.length === 14 ? cnpjOk(doc_) : false)) erro("cpf", "CPF/CNPJ inválido. Confira os números.");
  if (tel_ && ![10, 11].includes(tel_.length)) erro("telefone", "Telefone incompleto. Informe DDD + número.");
  if (mail_ && !/^\S+@\S+\.\S+$/.test(mail_)) erro("email", "E-mail inválido.");
  if (primeiro) { primeiro.focus(); primeiro.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
  const dup = doc_ && clientes.find(c => c.id !== editandoId && soNum(c.cpf) === doc_);
  if (dup && !confirm(`Já existe um cliente com este CPF/CNPJ: ${dup.nome}. Salvar mesmo assim?`)) return;
  const btn = $("btnSalvar");
  btn.disabled = true;
  try {
    const dados = {
      nome: $("nome").value.trim(),
      cpf: $("cpf").value,
      nascimento: $("nascimento").value,
      telefone: $("telefone").value,
      whatsapp: $("whatsapp").checked ? "Sim" : "Não",
      email: $("email").value.trim(),
      valor: lerValor(),
      status: $("status").value,
      observacoes: $("observacoes").value,
      proximoContato: $("proximoContato").value
    };
    if (ultimaConsulta && ultimaConsulta.cnpj === doc_) {
      dados.situacaoReceita = ultimaConsulta.situacao;
      dados.situacaoReceitaEm = hojeISO();
    }
    let id = editandoId;
    if (id) {
      const ant = clientes.find(x => x.id === id);
      const mud = ant ? [["Status", ant.status, dados.status], ["Valor", brl(ant.valor), brl(dados.valor)],
        ["Retorno", fmtData(ant.proximoContato) || "-", fmtData(dados.proximoContato) || "-"]]
        .filter(x => x[1] !== x[2]).map(x => registro(`${x[0]}: ${x[1]} → ${x[2]}`)) : [];
      await atualizar(id, mud.length ? { ...dados, historico: arrayUnion(...mud) } : dados);
    } else {
      const novo = await criar({ ...dados, documentos: [], timeline: [], historico: [registro("Cliente cadastrado")], criadoEm: serverTimestamp() });
      id = novo.id;
      editandoId = id; // se o envio de arquivos falhar, um novo "Salvar" atualiza este mesmo cliente
    }
    // Upload dos documentos para o Storage
    const novos = [];
    for (let i = 0; i < arquivosPend.length; i++) {
      btn.textContent = `Enviando ${i + 1} de ${arquivosPend.length}...`;
      novos.push(await salvarArquivo(id, arquivosPend[i]));
    }
    if (novos.length) await atualizar(id, { documentos: arrayUnion(...novos) });
    limparForm();
    toast("Cliente salvo");
    location.hash = "clientes";
  } catch (e) {
    alert("Erro ao salvar: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = editandoId ? "Salvar alterações" : "Salvar cliente";
    $("barra").classList.add("hidden");
  }
};

window.editarCliente = id => {
  const c = clientes.find(x => x.id === id);
  if (!c) return;
  editandoId = id;
  $("nome").value = c.nome; $("cpf").value = c.cpf; $("nascimento").value = c.nascimento || "";
  $("telefone").value = c.telefone; $("whatsapp").checked = c.whatsapp === "Sim"; $("email").value = c.email;
  $("valor").value = c.valor ? brl(c.valor) : ""; $("proximoContato").value = c.proximoContato || ""; $("status").value = c.status; $("observacoes").value = c.observacoes || "";
  $("tituloForm").textContent = "Editar Cliente";

  ultimaConsulta = null; $("cnpjInfo").textContent = "";

};

/* ===== Utilidades ===== */
const soNum = v => (v || "").replace(/\D/g, "");
const ATIVOS = ["Em negociação", "Em acompanhamento"];
const STATUS = ["Em negociação", "Fechado", "Em acompanhamento", "Encerrado"];
const z = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
const diasDesde = d => Math.round((z(new Date()) - z(d)) / 864e5);
const fmtData = iso => iso ? new Date(iso + "T00:00").toLocaleDateString("pt-BR") : "";
const dataRetorno = c => new Date(c.proximoContato + "T00:00");

function relativo(d) {
  if (d <= 0) return "hoje";
  if (d === 1) return "ontem";
  if (d < 30) return `há ${d} dias`;
  if (d < 365) { const m = Math.floor(d / 30); return `há ${m} ${m === 1 ? "mês" : "meses"}`; }
  const a = Math.floor(d / 365); return `há ${a} ${a === 1 ? "ano" : "anos"}`;
}
function ultimoContato(c) {
  const t = c.timeline || [];
  if (!t.length) return null;
  const i = t[t.length - 1];
  const [d, m, y] = (i.data || "").split("/");
  const [H = 0, M = 0, S = 0] = (i.hora || "").split(":");
  return new Date(+y, m - 1, +d, +H, +M, +S);
}

function cpfOk(v) {
  if (/^(\d)\1+$/.test(v)) return false;
  let s = 0; for (let i = 0; i < 9; i++) s += +v[i] * (10 - i);
  if ((s * 10) % 11 % 10 !== +v[9]) return false;
  s = 0; for (let i = 0; i < 10; i++) s += +v[i] * (11 - i);
  return (s * 10) % 11 % 10 === +v[10];
}
function cnpjOk(v) {
  if (/^(\d)\1+$/.test(v)) return false;
  const calc = n => { let p = n - 7, s = 0; for (let i = 0; i < n; i++) { s += +v[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +v[12] && calc(13) === +v[13];
}

/* ===== Lista ===== */
let ordem = { campo: "nome", dir: 1 };
let limite = 50;
const rotulos = { nome: "Cliente", valor: "Valor", status: "Status", ultimo: "Último contato", retorno: "Retorno" };
const chaves = {
  nome: c => c.nome.toLowerCase(), valor: c => c.valor, status: c => c.status,
  ultimo: c => ultimoContato(c)?.getTime() ?? -1, retorno: c => c.proximoContato || "9999"
};

function filtrados() {
  const t = $("busca").value.toLowerCase(), tn = soNum(t), f = $("filtroStatus").value;
  return clientes.filter(c =>
    (c.nome.toLowerCase().includes(t) || (c.cpf || "").includes(t) || (c.telefone || "").includes(t)
      || (tn && (soNum(c.cpf).includes(tn) || soNum(c.telefone).includes(tn))))
    && (!f || c.status === f))
    .sort((a, b) => {
      const x = chaves[ordem.campo](a), y = chaves[ordem.campo](b);
      return (x > y ? 1 : x < y ? -1 : 0) * ordem.dir;
    });
}

function renderizarClientes() {
  // Cartões de resumo (clicáveis = filtro)
  const f = $("filtroStatus").value;
  const soma = l => l.reduce((t, c) => t + Number(c.valor), 0);
  const cartao = (rot, lista, val) => `<div class="res ${f === val ? "ativo" : ""}" onclick="filtrarStatus('${val}')">
    <small>${rot}</small><b>${lista.length}</b><span>${brl(soma(lista))}</span></div>`;
  $("resumo").innerHTML = cartao("Todos", clientes, "") +
    STATUS.map(st => cartao(st, clientes.filter(c => c.status === st), st)).join("");

  // Aviso de retornos
  const pend = clientes.filter(c => c.proximoContato && c.status !== "Encerrado" && diasDesde(dataRetorno(c)) >= 0)
    .sort((a, b) => a.proximoContato.localeCompare(b.proximoContato));
  $("alertaRetorno").classList.toggle("hidden", !pend.length);
  $("alertaRetorno").innerHTML = `⚠️ ${pend.length} retorno${pend.length > 1 ? "s" : ""} para hoje ou atrasado${pend.length > 1 ? "s" : ""}: `
    + pend.map(c => `<a href="#cliente/${c.id}">${esc(c.nome)}</a>`).join(", ");

  // Cabeçalhos com seta
  for (const k in rotulos)
    $("th-" + k).textContent = rotulos[k] + (ordem.campo === k ? (ordem.dir === 1 ? " ▲" : " ▼") : "");
  $("ordenacao").value = ordem.campo in chaves && $("ordenacao").querySelector(`[value="${ordem.campo}"]`) ? ordem.campo : "nome";

  // Linhas
  const lista = filtrados();
  $("contagem").textContent = `${lista.length} cliente${lista.length === 1 ? "" : "s"} · Total negociado: ${brl(soma(lista))}`;
  $("listaClientes").innerHTML = lista.slice(0, limite).map(c => {
    const uc = ultimoContato(c);
    let ultimo = '<span class="vazio">Sem contato</span>';
    if (uc) {
      const d = diasDesde(uc);
      const cl = ATIVOS.includes(c.status) ? (d > 30 ? "muito" : d > 15 ? "atraso" : "") : "";
      ultimo = `<span class="${cl}" title="${esc(uc.toLocaleString("pt-BR"))}">${relativo(d)}</span>`;
    }
    let ret = '<span class="vazio">-</span>';
    if (c.proximoContato) {
      const d = diasDesde(dataRetorno(c));
      ret = d > 0 ? `<span class="muito">${fmtData(c.proximoContato)} (atrasado)</span>`
          : d === 0 ? '<span class="atraso">Hoje</span>' : fmtData(c.proximoContato);
    }
    return `<tr class="linha" onclick="location.hash='cliente/${c.id}'">
      <td><a class="nome-link" href="#cliente/${c.id}">${esc(c.nome)}</a><div class="sub">${esc(c.cpf) || "Sem CPF/CNPJ"}</div></td>
      <td data-label="Telefone">${esc(c.telefone) || "-"} ${c.whatsapp === "Sim" && c.telefone ? "💬" : ""}</td>
      <td data-label="Valor">${brl(c.valor)}</td><td data-label="Status">${badge(c.status)}</td>
      <td data-label="Último contato">${ultimo}</td><td data-label="Retorno">${ret}</td>
      <td class="acoes">
        <button class="icone sec" title="Editar" onclick="event.stopPropagation();editarCliente('${c.id}')">✏️</button>
        <button class="icone perigo" title="Excluir" onclick="event.stopPropagation();excluirCliente('${c.id}')">🗑️</button>
      </td></tr>`;
  }).join("") || '<tr><td colspan="7" class="vazio">Nenhum cliente encontrado.</td></tr>';

  const resto = lista.length - limite;
  $("btnMais").classList.toggle("hidden", resto <= 0);
  $("btnMais").textContent = `Mostrar mais (${resto} restantes)`;
}

window.exportarCSV = () => {
  const q = v => { let t = String(v ?? ""); if (/^[=+\-@]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
  const cab = ["Nome", "CPF/CNPJ", "Nascimento", "Telefone", "WhatsApp", "E-mail", "Valor", "Status", "Último contato", "Retorno", "Observações"];
  const linhas = filtrados().map(c => {
    const uc = ultimoContato(c);
    return [c.nome, c.cpf, fmtData(c.nascimento), c.telefone, c.whatsapp, c.email, String(c.valor).replace(".", ","),
      c.status, uc ? uc.toLocaleDateString("pt-BR") : "", fmtData(c.proximoContato), c.observacoes].map(q).join(";");
  });
  const blob = new Blob(["\ufeff" + [cab.map(q).join(";"), ...linhas].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `clientes-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

const MAX_MB = 10;

async function salvarArquivo(cid, file) {
  const seguro = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w.\-]+/g, "_");
  const path = `${cid}/${Date.now()}_${seguro}`;
  const r = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined });
  if (r.error) throw new Error(r.error.message);
  return { nome: file.name, path, tamanho: file.size };
}

  const r = await sb.storage.from(BUCKET).createSignedUrl(d.path, 120);
  if (r.error) { if (w) w.close(); toast("Não foi possível abrir o arquivo.", true); return; }
  if (w) w.location.href = r.data.signedUrl; else location.href = r.data.signedUrl;
};

function renderizarPainel() {
  const soma = l => l.reduce((t, c) => t + Number(c.valor), 0);
  const abertos = clientes.filter(c => ATIVOS.includes(c.status));
  const fechados = clientes.filter(c => c.status === "Fechado");
  const taxa = clientes.length ? Math.round(fechados.length / clientes.length * 100) : 0;
  const item = (c, info) => `<div class="item"><a href="#cliente/${c.id}">${esc(c.nome)}</a><span class="sub">${info}</span></div>`;
  const retornos = clientes.filter(c => c.proximoContato && c.status !== "Encerrado" && diasDesde(dataRetorno(c)) >= 0)
    .sort((a, b) => a.proximoContato.localeCompare(b.proximoContato));
  const parados = abertos.map(c => ({ c, u: ultimoContato(c) })).filter(x => !x.u || diasDesde(x.u) > 15)
    .sort((a, b) => (a.u?.getTime() ?? 0) - (b.u?.getTime() ?? 0));
  const meses = [...Array(6)].map((_, i) => {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 5 + i);
    return { k: `${d.getFullYear()}-${d.getMonth()}`, rot: d.toLocaleDateString("pt-BR", { month: "short" }), v: 0 };
  });
  fechados.forEach(c => {
    const d = c.criadoEm ? new Date(c.criadoEm) : null;
    const m = d && meses.find(x => x.k === `${d.getFullYear()}-${d.getMonth()}`);
    if (m) m.v += Number(c.valor);
  });
  const max = Math.max(1, ...meses.map(m => m.v));
  const card = (t, v, sub) => `<div class="res est"><small>${t}</small><b>${v}</b><span>${sub}</span></div>`;
  $("painelConteudo").innerHTML = `
    <div class="resumo">
      ${card("Clientes", clientes.length, "cadastrados")}
      ${card("Em aberto", brl(soma(abertos)), abertos.length + " clientes")}
      ${card("Fechado", brl(soma(fechados)), fechados.length + " clientes")}
      ${card("Taxa de fechamento", taxa + "%", "dos cadastros")}
    </div>
    <div class="container"><h3>Retornos de hoje e atrasados (${retornos.length})</h3>
      ${retornos.map(c => item(c, diasDesde(dataRetorno(c)) === 0 ? "hoje" : fmtData(c.proximoContato))).join("") || '<p class="vazio">Nenhum retorno pendente.</p>'}</div>
    <div class="container"><h3>Sem contato há mais de 15 dias (${parados.length})</h3>
      ${parados.map(x => item(x.c, x.u ? relativo(diasDesde(x.u)) : "sem contato")).join("") || '<p class="vazio">Todos os clientes em aberto estão em dia.</p>'}</div>
    <div class="container"><h3>Valor fechado por mês de cadastro</h3>
      <div class="barras">${meses.map(m => `<div class="bcol"><span>${m.v ? brl(m.v).replace(",00", "") : ""}</span><i style="height:${Math.round(m.v / max * 100)}%"></i><span>${m.rot}</span></div>`).join("")}</div></div>`;
}

function lerCSV(txt) {
  txt = txt.replace(/^\ufeff/, "");
  const prim = txt.split("\n")[0];
  const sep = (prim.match(/;/g) || []).length >= (prim.match(/,/g) || []).length ? ";" : ",";
  const linhas = []; let l = [], c = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { l.push(c); c = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && txt[i + 1] === "\n") i++; l.push(c); c = ""; if (l.some(x => x !== "")) linhas.push(l); l = []; }
    else c += ch;
  }
  if (c || l.length) { l.push(c); linhas.push(l); }
  return linhas;
}
const fmtDoc = d => d.length === 11 ? `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`
  : d.length === 14 ? `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12)}` : d;
const fmtTel = d => d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d;

window.importarCSV = async inp => {
  const f = inp.files[0]; inp.value = "";
  if (!f) return;
  const linhas = lerCSV(await f.text());
  const cab = (linhas.shift() || []).map(x => x.trim().toLowerCase());
  const ix = n => cab.findIndex(x => x.startsWith(n));
  const col = { nome: ix("nome"), cpf: ix("cpf"), nasc: ix("nasc"), tel: ix("tel"), wa: ix("whats"), mail: ix("e-mail"), valor: ix("valor"), st: ix("status"), ret: ix("retorno"), obs: ix("obs") };
  if (col.nome < 0) { toast('A planilha precisa ter a coluna "Nome".', true); return; }
  const g = (l, k) => col[k] >= 0 ? (l[col[k]] || "").trim() : "";
  const iso = d => { const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : ""; };
  const num = v => { const t = v.replace(/[^\d,.-]/g, ""); return Number(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t) || 0; };
  const cpfs = new Set(clientes.map(c => soNum(c.cpf)).filter(Boolean));
  const novos = []; let ign = 0;
  for (const l of linhas) {
    const nome = g(l, "nome"), cpf = soNum(g(l, "cpf"));
    if (!nome || (cpf && cpfs.has(cpf))) { ign++; continue; }
    if (cpf) cpfs.add(cpf);
    const st = g(l, "st");
    novos.push({
      nome, cpf: fmtDoc(cpf), nascimento: iso(g(l, "nasc")), telefone: fmtTel(soNum(g(l, "tel"))),
      whatsapp: /^n/i.test(g(l, "wa")) ? "Não" : "Sim", email: g(l, "mail"), valor: num(g(l, "valor")),
      status: STATUS.includes(st) ? st : "Em negociação", observacoes: g(l, "obs"), proximoContato: iso(g(l, "ret"))
    });
  }
  if (!novos.length) { toast(`Nada para importar (${ign} linha(s) ignorada(s)).`, true); return; }
  if (!confirm(`Importar ${novos.length} cliente(s)? ${ign} linha(s) serão ignoradas (sem nome ou CPF/CNPJ já cadastrado).`)) return;
  try {
    for (const n of novos) await criar({ ...n, documentos: [], timeline: [], historico: [registro("Importado via CSV")], criadoEm: serverTimestamp() });
    toast(`${novos.length} cliente(s) importado(s).`);
  } catch (e) { toast("Erro na importação: " + e.message, true); }
};

/* ===== Receita: CNPJ (automático) e CPF (semi-automático) ===== */
const hojeISO = () => new Date().toLocaleDateString("sv-SE");

async function consultaCNPJ(cnpj) {
  const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function buscarCNPJ(cnpj) {
  const info = $("cnpjInfo");
  info.className = "sub";
  info.textContent = "Consultando a Receita...";
  try {
    const d = await consultaCNPJ(cnpj);
    if (soNum($("cpf").value) !== cnpj) return; // usuário já mudou o campo
    if (!d) { info.className = "sub muito"; info.textContent = "CNPJ não encontrado na base da Receita."; return; }
    if (!$("nome").value.trim()) $("nome").value = d.razao_social || "";
    if (!$("telefone").value && d.ddd_telefone_1) {
      $("telefone").value = d.ddd_telefone_1;
      $("telefone").dispatchEvent(new Event("input"));
    }
    if (!$("email").value && d.email) $("email").value = String(d.email).toLowerCase();
    ultimaConsulta = { cnpj, situacao: d.descricao_situacao_cadastral || "" };
    info.className = ultimaConsulta.situacao === "ATIVA" ? "sub" : "sub muito";
    info.textContent = `${d.razao_social}${d.nome_fantasia ? " (" + d.nome_fantasia + ")" : ""} · Situação: ${ultimaConsulta.situacao}`;
  } catch (e) {
    info.className = "sub";
    info.textContent = "Não foi possível consultar agora. Preencha manualmente.";
  }
}

$("cpf").addEventListener("input", function () {
  const d = soNum(this.value), info = $("cnpjInfo");
  ultimaConsulta = ultimaConsulta && ultimaConsulta.cnpj === d ? ultimaConsulta : null;
  if (d.length === 14) {
    if (!cnpjOk(d)) { info.className = "sub muito"; info.textContent = "CNPJ inválido."; }
    else if (!ultimaConsulta) buscarCNPJ(d);
  } else if (d.length === 11 && !cpfOk(d)) {
    info.className = "sub muito"; info.textContent = "CPF inválido.";
  } else { info.textContent = ""; }
});

window.atualizarSituacaoCNPJ = async id => {
  const c = clientes.find(x => x.id === id);
  const dica = $("dicaReceita");
  try {
    dica.textContent = "Consultando a Receita...";

    await atualizar(id, { situacaoReceita: d.descricao_situacao_cadastral || "", situacaoReceitaEm: hojeISO() });
    dica.textContent = `Situação atualizada: ${d.descricao_situacao_cadastral}.`;
  } catch (e) { dica.textContent = "Não foi possível consultar agora. Tente novamente mais tarde."; }
};

  const c = clientes.find(x => x.id === id);

};

window.anexarDocumentos = async id => {
  const files = $("novoDoc").files;
  if (!files.length) { alert("Escolha um arquivo para anexar."); return; }
  const btn = $("btnAnexar");
  btn.disabled = true;
  try {
    const novos = [];
    for (const file of files) {
      if (!arquivoOk(file)) continue;
      novos.push(await salvarArquivo(id, file));
    }
    if (novos.length) await atualizar(id, { documentos: arrayUnion(...novos) });
    $("novoDoc").value = "";
  } catch (e) { alert("Erro ao anexar: " + e.message); }
  finally { btn.disabled = false; }
};

function renderizarTimeline(c) {

      </div>
      ${esc(i.comentario)}
    </div>`).join("") || '<p class="vazio">Nenhuma interação registrada.</p>';
}
