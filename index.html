<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Simples</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:20px}
.container{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1,h2,h3{margin-bottom:15px}
input,select,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px}
button{background:#0078d4;color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer}
button:hover{background:#005ea6}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#6b7280}
table{width:100%;border-collapse:collapse;margin-top:15px}
table th{background:#0078d4;color:#fff}
th,td{border:1px solid #ddd;padding:10px}
.timeline-item{margin-bottom:10px;border-left:5px solid #0078d4;padding:10px;background:#f9f9f9;border-radius:8px}
.timeline-whatsapp{border-left-color:#25D366}
.timeline-ligacao{border-left-color:#0ea5e9}
.timeline-email{border-left-color:#f97316}
.timeline-presencial{border-left-color:#8b5cf6}
.hidden{display:none}
.card-resumo{background:#eff6ff;padding:15px;border-radius:10px;font-size:18px;font-weight:bold;color:#0078d4;margin-top:10px}
.documento{background:#f5f5f5;padding:8px;margin-bottom:5px;border-radius:5px}
.documento a{color:#0078d4;text-decoration:none}
#login{max-width:380px;margin:60px auto}
#erroLogin{color:#c00;margin-bottom:10px}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.topo h1{margin:0}
.det-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.det-topo h2{margin:0 0 8px}
.det-acoes{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:bold}
.st-neg{background:#fef3c7;color:#92400e}
.st-fechado{background:#dcfce7;color:#166534}
.st-acomp{background:#dbeafe;color:#1e40af}
.st-enc{background:#e5e7eb;color:#374151}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.campo small{display:block;color:#6b7280;font-size:12px;margin-bottom:3px}
.campo span{font-size:16px;word-break:break-word}
.campo.valor span{font-size:22px;font-weight:bold;color:#0078d4}
.obs{background:#f9fafb;border-radius:8px;padding:12px;white-space:pre-wrap}
.secao{margin-top:24px;padding-top:20px;border-top:1px solid #e5e7eb}
.secao h3{margin-bottom:12px}
.novo-comentario{background:#f9fafb;border-radius:10px;padding:15px;margin-bottom:20px}
.novo-comentario button{margin-top:0}
.timeline-item .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:#6b7280;margin-bottom:6px}
.timeline-item .tipo{font-weight:bold;color:#111}
.vazio{color:#6b7280}
.link-btn{display:inline-block;padding:10px 15px;border-radius:8px;background:#fff;color:#0078d4;border:1px solid #0078d4;text-decoration:none;font-size:14px;text-align:center}
.documento a{display:block}
td .link-btn{margin-right:4px}
@media(max-width:768px){td .link-btn{display:block;margin:5px 0 0}}
@media(max-width:768px){.link-btn{flex:1 1 100%}}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.filtros input{flex:2 1 260px;margin:0}
.filtros select{flex:1 1 180px;margin:0}
.so-mobile{display:none}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.res{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;border:2px solid transparent}
.res.ativo{border-color:#0078d4}
.res small{color:#6b7280;display:block;margin-bottom:4px}
.res b{font-size:20px;display:block;color:#0078d4}
.res span{font-size:13px;color:#374151}
.alerta{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:12px 15px;border-radius:10px;margin-bottom:20px}
.alerta a{color:#9a3412;font-weight:bold}
th.ord{cursor:pointer;user-select:none}
.linha{cursor:pointer}
.linha:hover{background:#f5f9ff}
.nome-link{color:#111;font-weight:bold;text-decoration:none}
.sub{font-size:12px;color:#6b7280}
.atraso{color:#c2410c;font-weight:bold}
.muito{color:#b91c1c;font-weight:bold}
.icone{padding:8px 11px;margin:0}
.perigo{background:#dc2626}
.perigo:hover{background:#b91c1c}
td.acoes{white-space:nowrap}
td.acoes .perigo{margin-left:18px}
#contagem{margin:12px 0 0}
#btnMais{margin-top:15px}
@media(max-width:768px){.icone{width:auto}.so-mobile{display:block}.filtros button{width:100%}}
.menu{display:flex;gap:8px;margin-bottom:20px}
.menu button{background:#fff;color:#0078d4;border:1px solid #0078d4}
.menu button.ativo{background:#0078d4;color:#fff}
@media(max-width:768px){
table,thead,tbody,th,td,tr{display:block}
thead{display:none}
tr{margin-bottom:15px;border:1px solid #ddd;border-radius:10px;background:#fff;padding:10px}
td{border:none;padding:5px}
button{width:100%;margin-top:5px}
.topo button{width:auto}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="container">
  <h2>Entrar no CRM</h2>
  <input id="loginEmail" type="email" placeholder="E-mail">
  <input id="loginSenha" type="password" placeholder="Senha">
  <div id="erroLogin"></div>
  <button id="btnEntrar">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topo">
    <h1>CRM Simples</h1>
    <button class="sec" id="btnSair">Sair</button>
  </div>

  <div class="menu">
    <button id="navClientes" class="ativo">Clientes</button>
    <button id="navNovo">+ Novo Cliente</button>
  </div>

  <!-- PÁGINA: NOVO CLIENTE -->
  <div id="paginaNovo" class="hidden">
  <div class="container">
    <h2 id="tituloForm">Novo Cliente</h2>
    <input id="nome" placeholder="Nome Completo">
    <input id="cpf" placeholder="CPF/CNPJ">
    <label>Data de nascimento</label>
    <input id="nascimento" type="date">
    <input id="telefone" placeholder="Telefone">
    <select id="whatsapp"><option>Sim</option><option>Não</option></select>
    <input id="email" placeholder="E-mail">
    <input id="valor" type="number" placeholder="Valor Negociado">
    <select id="status">
      <option>Em negociação</option><option>Fechado</option>
      <option>Em acompanhamento</option><option>Encerrado</option>
    </select>
    <label>Próximo contato (retorno)</label>
    <input id="proximoContato" type="date">
    <textarea id="observacoes" placeholder="Observações gerais"></textarea>
    <label>Documentos</label>
    <input id="documentos" type="file" multiple>
    <button id="btnSalvar" onclick="salvarCliente()">Salvar Cliente</button>
    <button class="sec" id="btnCancelar" onclick="cancelarEdicao()">Cancelar</button>
  </div>
  </div>

  <!-- PÁGINA: CLIENTES -->
  <div id="paginaClientes">
  <div id="alertaRetorno" class="alerta hidden"></div>
  <div class="resumo" id="resumo"></div>
  <div class="container">
    <div class="filtros">
      <input id="busca" placeholder="Buscar por nome, CPF/CNPJ ou telefone..." oninput="resetPagina()">
      <select id="filtroStatus" onchange="resetPagina()">
        <option value="">Todos os status</option>
        <option>Em negociação</option><option>Fechado</option>
        <option>Em acompanhamento</option><option>Encerrado</option>
      </select>
      <select id="ordenacao" class="so-mobile" onchange="ordenarSel()">
        <option value="nome">Ordenar: Nome</option><option value="valor">Ordenar: Maior valor</option>
        <option value="ultimo">Ordenar: Sem contato há mais tempo</option><option value="retorno">Ordenar: Retorno</option>
      </select>
      <button class="sec" onclick="exportarCSV()">Exportar CSV</button>
    </div>
    <div id="contagem" class="vazio"></div>
    <table>
      <thead><tr>
        <th class="ord" id="th-nome" onclick="ordenarPor('nome')">Cliente</th>
        <th>Telefone</th>
        <th class="ord" id="th-valor" onclick="ordenarPor('valor')">Valor</th>
        <th class="ord" id="th-status" onclick="ordenarPor('status')">Status</th>
        <th class="ord" id="th-ultimo" onclick="ordenarPor('ultimo')">Último contato</th>
        <th class="ord" id="th-retorno" onclick="ordenarPor('retorno')">Retorno</th>
        <th>Ações</th>
      </tr></thead>
      <tbody id="listaClientes"></tbody>
    </table>
    <button class="sec hidden" id="btnMais" onclick="mostrarMais()">Mostrar mais</button>
  </div>
  </div>

  <!-- PÁGINA: DETALHES DO CLIENTE -->
  <div id="paginaCliente" class="hidden">
    <div id="detalhesCliente" class="container"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot,
  arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ===== 1) COLE AQUI A CONFIG DO SEU PROJETO (Console Firebase > Configurações > Seus apps) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAg22U5g9yIMchfUx3M6KwjCHmbE5Fjzus",
  authDomain: "malf-capital.firebaseapp.com",
  projectId: "malf-capital",
  storageBucket: "malf-capital.firebasestorage.app",
  messagingSenderId: "487992305267",
  appId: "1:487992305267:web:5a11019533974c0276ec06",
  measurementId: "G-0DG163YS2E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const col = collection(db, "clientes");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => Number(n || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});

const classeStatus = {"Em negociação":"st-neg","Fechado":"st-fechado","Em acompanhamento":"st-acomp","Encerrado":"st-enc"};
const badge = st => `<span class="badge ${classeStatus[st] || "st-enc"}">${esc(st)}</span>`;
const tipos = {whatsapp:"💬 WhatsApp", ligacao:"📞 Ligação", email:"✉️ E-mail", presencial:"🤝 Presencial"};

let clientes = [];
let clienteAtualId = null;
let carregado = false;
let editandoId = null;
let ordemValor = false;
let unsub = null;

/* ===== Navegação entre páginas ===== */
function rota() {
  const h = location.hash;
  const novo = h === "#novo";
  const m = h.match(/^#cliente\/(.+)$/);
  $("paginaNovo").classList.toggle("hidden", !novo);
  $("paginaCliente").classList.toggle("hidden", !m);
  $("paginaClientes").classList.toggle("hidden", novo || !!m);
  $("navNovo").classList.toggle("ativo", novo);
  $("navClientes").classList.toggle("ativo", !novo);
  clienteAtualId = m ? m[1] : null;
  if (m) abrirCliente(clienteAtualId);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", rota);
$("navClientes").onclick = () => { location.hash = "clientes"; };
$("navNovo").onclick = () => { limparForm(); location.hash = "novo"; };

/* ===== Autenticação ===== */
$("btnEntrar").onclick = async () => {
  $("erroLogin").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginSenha").value);
  } catch (e) {
    $("erroLogin").textContent = "E-mail ou senha incorretos.";
  }
};
$("loginSenha").addEventListener("keydown", e => { if (e.key === "Enter") $("btnEntrar").click(); });
$("btnSair").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $("login").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  if (unsub) { unsub(); unsub = null; }
  if (user) {
    unsub = onSnapshot(col, snap => {
      clientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      carregado = true;
      renderizarClientes();
      if (clienteAtualId) abrirCliente(clienteAtualId, true);
    }, err => alert("Erro ao carregar clientes: " + err.message));
  } else {
    clientes = []; carregado = false;
  }
});

/* ===== Máscaras ===== */
$("cpf").addEventListener("input", function () {
  let v = this.value.replace(/\D/g, "").slice(0, 14);
  if (v.length <= 11) {
    v = v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  } else {
    v = v.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
         .replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
  }
  this.value = v;
});
$("telefone").addEventListener("input", function () {
  let v = this.value.replace(/\D/g, "").slice(0, 11);
  v = v.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d)(\d{4})$/, "$1-$2");
  this.value = v;
});

/* ===== Cadastro / edição ===== */
function limparForm() {
  ["nome","cpf","nascimento","telefone","email","valor","observacoes","documentos","proximoContato"].forEach(i => $(i).value = "");
  $("whatsapp").selectedIndex = 0;
  $("status").selectedIndex = 0;
  editandoId = null;
  $("tituloForm").textContent = "Novo Cliente";
  $("btnSalvar").textContent = "Salvar Cliente";
}

window.cancelarEdicao = () => { limparForm(); location.hash = "clientes"; };

window.salvarCliente = async () => {
  if (!$("nome").value.trim()) { alert("Informe o nome do cliente."); return; }
  const doc_ = soNum($("cpf").value), tel_ = soNum($("telefone").value), mail_ = $("email").value.trim();
  if (doc_ && !(doc_.length === 11 ? cpfOk(doc_) : doc_.length === 14 ? cnpjOk(doc_) : false)) { alert("CPF/CNPJ inválido. Confira os números."); return; }
  if (tel_ && ![10, 11].includes(tel_.length)) { alert("Telefone incompleto. Informe DDD + número."); return; }
  if (mail_ && !/^\S+@\S+\.\S+$/.test(mail_)) { alert("E-mail inválido."); return; }
  const dup = doc_ && clientes.find(c => c.id !== editandoId && soNum(c.cpf) === doc_);
  if (dup && !confirm(`Já existe um cliente com este CPF/CNPJ: ${dup.nome}. Salvar mesmo assim?`)) return;
  const btn = $("btnSalvar");
  btn.disabled = true;
  try {
    const dados = {
      nome: $("nome").value.trim(),
      cpf: $("cpf").value,
      nascimento: $("nascimento").value,
      telefone: $("telefone").value,
      whatsapp: $("whatsapp").value,
      email: $("email").value.trim(),
      valor: Number($("valor").value) || 0,
      status: $("status").value,
      observacoes: $("observacoes").value,
      proximoContato: $("proximoContato").value
    };
    let id = editandoId;
    if (id) {
      await updateDoc(doc(db, "clientes", id), dados);
    } else {
      const novo = await addDoc(col, { ...dados, documentos: [], timeline: [], criadoEm: serverTimestamp() });
      id = novo.id;
    }
    // Upload dos documentos para o Storage
    const novos = [];
    for (const file of $("documentos").files) {
      const path = `clientes/${id}/${Date.now()}_${file.name}`;
      const r = ref(storage, path);
      await uploadBytes(r, file);
      novos.push({ nome: file.name, path, url: await getDownloadURL(r) });
    }
    if (novos.length) await updateDoc(doc(db, "clientes", id), { documentos: arrayUnion(...novos) });
    limparForm();
    alert("Cliente salvo");
    location.hash = "clientes";
  } catch (e) {
    alert("Erro ao salvar: " + e.message);
  } finally {
    btn.disabled = false;
  }
};

window.editarCliente = id => {
  const c = clientes.find(x => x.id === id);
  if (!c) return;
  editandoId = id;
  $("nome").value = c.nome; $("cpf").value = c.cpf; $("nascimento").value = c.nascimento || "";
  $("telefone").value = c.telefone; $("whatsapp").value = c.whatsapp; $("email").value = c.email;
  $("valor").value = c.valor; $("proximoContato").value = c.proximoContato || ""; $("status").value = c.status; $("observacoes").value = c.observacoes || "";
  $("tituloForm").textContent = "Editar Cliente";
  $("btnSalvar").textContent = "Salvar alterações";
  location.hash = "novo";
};

/* ===== Lista ===== */
/* ===== Utilidades ===== */
const soNum = v => (v || "").replace(/\D/g, "");
const ATIVOS = ["Em negociação", "Em acompanhamento"];
const STATUS = ["Em negociação", "Fechado", "Em acompanhamento", "Encerrado"];
const z = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
const diasDesde = d => Math.round((z(new Date()) - z(d)) / 864e5);
const fmtData = iso => iso ? new Date(iso + "T00:00").toLocaleDateString("pt-BR") : "";
const dataRetorno = c => new Date(c.proximoContato + "T00:00");

function relativo(d) {
  if (d <= 0) return "hoje";
  if (d === 1) return "ontem";
  if (d < 30) return `há ${d} dias`;
  if (d < 365) { const m = Math.floor(d / 30); return `há ${m} ${m === 1 ? "mês" : "meses"}`; }
  const a = Math.floor(d / 365); return `há ${a} ${a === 1 ? "ano" : "anos"}`;
}
function ultimoContato(c) {
  const t = c.timeline || [];
  if (!t.length) return null;
  const i = t[t.length - 1];
  const [d, m, y] = (i.data || "").split("/");
  const [H = 0, M = 0, S = 0] = (i.hora || "").split(":");
  return new Date(+y, m - 1, +d, +H, +M, +S);
}

function cpfOk(v) {
  if (/^(\d)\1+$/.test(v)) return false;
  let s = 0; for (let i = 0; i < 9; i++) s += +v[i] * (10 - i);
  if ((s * 10) % 11 % 10 !== +v[9]) return false;
  s = 0; for (let i = 0; i < 10; i++) s += +v[i] * (11 - i);
  return (s * 10) % 11 % 10 === +v[10];
}
function cnpjOk(v) {
  if (/^(\d)\1+$/.test(v)) return false;
  const calc = n => { let p = n - 7, s = 0; for (let i = 0; i < n; i++) { s += +v[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +v[12] && calc(13) === +v[13];
}

/* ===== Lista ===== */
let ordem = { campo: "nome", dir: 1 };
let limite = 50;
const rotulos = { nome: "Cliente", valor: "Valor", status: "Status", ultimo: "Último contato", retorno: "Retorno" };
const chaves = {
  nome: c => c.nome.toLowerCase(), valor: c => c.valor, status: c => c.status,
  ultimo: c => ultimoContato(c)?.getTime() ?? -1, retorno: c => c.proximoContato || "9999"
};

function filtrados() {
  const t = $("busca").value.toLowerCase(), tn = soNum(t), f = $("filtroStatus").value;
  return clientes.filter(c =>
    (c.nome.toLowerCase().includes(t) || (c.cpf || "").includes(t) || (c.telefone || "").includes(t)
      || (tn && (soNum(c.cpf).includes(tn) || soNum(c.telefone).includes(tn))))
    && (!f || c.status === f))
    .sort((a, b) => {
      const x = chaves[ordem.campo](a), y = chaves[ordem.campo](b);
      return (x > y ? 1 : x < y ? -1 : 0) * ordem.dir;
    });
}

function renderizarClientes() {
  // Cartões de resumo (clicáveis = filtro)
  const f = $("filtroStatus").value;
  const soma = l => l.reduce((t, c) => t + Number(c.valor), 0);
  const cartao = (rot, lista, val) => `<div class="res ${f === val ? "ativo" : ""}" onclick="filtrarStatus('${val}')">
    <small>${rot}</small><b>${lista.length}</b><span>${brl(soma(lista))}</span></div>`;
  $("resumo").innerHTML = cartao("Todos", clientes, "") +
    STATUS.map(st => cartao(st, clientes.filter(c => c.status === st), st)).join("");

  // Aviso de retornos
  const pend = clientes.filter(c => c.proximoContato && c.status !== "Encerrado" && diasDesde(dataRetorno(c)) >= 0)
    .sort((a, b) => a.proximoContato.localeCompare(b.proximoContato));
  $("alertaRetorno").classList.toggle("hidden", !pend.length);
  $("alertaRetorno").innerHTML = `⚠️ ${pend.length} retorno${pend.length > 1 ? "s" : ""} para hoje ou atrasado${pend.length > 1 ? "s" : ""}: `
    + pend.map(c => `<a href="#cliente/${c.id}">${esc(c.nome)}</a>`).join(", ");

  // Cabeçalhos com seta
  for (const k in rotulos)
    $("th-" + k).textContent = rotulos[k] + (ordem.campo === k ? (ordem.dir === 1 ? " ▲" : " ▼") : "");
  $("ordenacao").value = ordem.campo in chaves && $("ordenacao").querySelector(`[value="${ordem.campo}"]`) ? ordem.campo : "nome";

  // Linhas
  const lista = filtrados();
  $("contagem").textContent = `${lista.length} cliente${lista.length === 1 ? "" : "s"} · Total negociado: ${brl(soma(lista))}`;
  $("listaClientes").innerHTML = lista.slice(0, limite).map(c => {
    const uc = ultimoContato(c);
    let ultimo = '<span class="vazio">Sem contato</span>';
    if (uc) {
      const d = diasDesde(uc);
      const cl = ATIVOS.includes(c.status) ? (d > 30 ? "muito" : d > 15 ? "atraso" : "") : "";
      ultimo = `<span class="${cl}" title="${esc(uc.toLocaleString("pt-BR"))}">${relativo(d)}</span>`;
    }
    let ret = '<span class="vazio">-</span>';
    if (c.proximoContato) {
      const d = diasDesde(dataRetorno(c));
      ret = d > 0 ? `<span class="muito">${fmtData(c.proximoContato)} (atrasado)</span>`
          : d === 0 ? '<span class="atraso">Hoje</span>' : fmtData(c.proximoContato);
    }
    return `<tr class="linha" onclick="location.hash='cliente/${c.id}'">
      <td><a class="nome-link" href="#cliente/${c.id}">${esc(c.nome)}</a><div class="sub">${esc(c.cpf) || "Sem CPF/CNPJ"}</div></td>
      <td>${esc(c.telefone) || "-"} ${c.whatsapp === "Sim" && c.telefone ? "💬" : ""}</td>
      <td>${brl(c.valor)}</td><td>${badge(c.status)}</td><td>${ultimo}</td><td>${ret}</td>
      <td class="acoes">
        <button class="icone sec" title="Editar" onclick="event.stopPropagation();editarCliente('${c.id}')">✏️</button>
        <button class="icone perigo" title="Excluir" onclick="event.stopPropagation();excluirCliente('${c.id}')">🗑️</button>
      </td></tr>`;
  }).join("") || '<tr><td colspan="7" class="vazio">Nenhum cliente encontrado.</td></tr>';

  const resto = lista.length - limite;
  $("btnMais").classList.toggle("hidden", resto <= 0);
  $("btnMais").textContent = `Mostrar mais (${resto} restantes)`;
}

window.resetPagina = () => { limite = 50; renderizarClientes(); };
window.mostrarMais = () => { limite += 50; renderizarClientes(); };
window.filtrarStatus = st => { $("filtroStatus").value = st; resetPagina(); };
window.ordenarPor = campo => {
  ordem = ordem.campo === campo ? { campo, dir: -ordem.dir } : { campo, dir: campo === "valor" ? -1 : 1 };
  renderizarClientes();
};
window.ordenarSel = () => { const c = $("ordenacao").value; ordem = { campo: c, dir: c === "valor" ? -1 : 1 }; renderizarClientes(); };

window.exportarCSV = () => {
  const q = v => { let t = String(v ?? ""); if (/^[=+\-@]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
  const cab = ["Nome", "CPF/CNPJ", "Nascimento", "Telefone", "WhatsApp", "E-mail", "Valor", "Status", "Último contato", "Retorno", "Observações"];
  const linhas = filtrados().map(c => {
    const uc = ultimoContato(c);
    return [c.nome, c.cpf, fmtData(c.nascimento), c.telefone, c.whatsapp, c.email, String(c.valor).replace(".", ","),
      c.status, uc ? uc.toLocaleDateString("pt-BR") : "", fmtData(c.proximoContato), c.observacoes].map(q).join(";");
  });
  const blob = new Blob(["\ufeff" + [cab.map(q).join(";"), ...linhas].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `clientes-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

window.excluirCliente = async id => {
  const c = clientes.find(x => x.id === id);
  if (!confirm(`Excluir "${c?.nome}"? Isso apaga também os documentos e o histórico.`)) return;
  try {
    for (const d of (c?.documentos || [])) {
      try { await deleteObject(ref(storage, d.path)); } catch (_) {}
    }
    await deleteDoc(doc(db, "clientes", id));
  } catch (e) { alert("Erro ao excluir: " + e.message); }
};

/* ===== Detalhes e linha do tempo ===== */
window.abrirCliente = (id, manterRascunho) => {
  const c = clientes.find(x => x.id === id);
  const div = $("detalhesCliente");
  if (!c) {
    div.innerHTML = `<div class="det-acoes"><button class="sec" onclick="fecharCliente()">← Voltar</button></div>
      <p class="vazio" style="margin-top:15px">${carregado ? "Cliente não encontrado." : "Carregando..."}</p>`;
    return;
  }

  // Atualização em tempo real: só redesenha a timeline se o painel já estiver aberto
  if (manterRascunho && $("timelineArea")) { renderizarTimeline(c); return; }

  const docs = (c.documentos || []).map(d =>
    `<div class="documento">📄 <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.nome)}</a></div>`).join("");

  const tel = (c.telefone || "").replace(/\D/g, "");
  const links = [
    c.whatsapp === "Sim" && tel ? `<a class="link-btn" href="https://wa.me/55${tel}" target="_blank" rel="noopener">💬 WhatsApp</a>` : "",
    tel ? `<a class="link-btn" href="tel:+55${tel}">📞 Ligar</a>` : "",
    c.email ? `<a class="link-btn" href="mailto:${esc(c.email)}">✉️ E-mail</a>` : ""
  ].join("");
  const campo = (rotulo, valor, extra = "") =>
    `<div class="campo ${extra}"><small>${rotulo}</small><span>${valor || "-"}</span></div>`;

  div.innerHTML = `
    <div class="det-topo">
      <div>
        <h2>${esc(c.nome)}</h2>
        ${badge(c.status)}
      </div>
      <div class="det-acoes">
        ${links}
        <button class="sec" onclick="editarCliente('${c.id}')">Editar</button>
        <button class="sec" onclick="fecharCliente()">← Voltar</button>
      </div>
    </div>

    <div class="grade">
      ${campo("CPF/CNPJ", esc(c.cpf))}
      ${campo("Nascimento", c.nascimento ? new Date(c.nascimento + "T00:00").toLocaleDateString("pt-BR") : "")}
      ${campo("Telefone", esc(c.telefone) + (c.whatsapp === "Sim" ? " (WhatsApp)" : ""))}
      ${campo("E-mail", esc(c.email))}
      ${campo("Valor negociado", brl(c.valor), "valor")}
      ${campo("Próximo contato", fmtData(c.proximoContato))}
    </div>

    ${c.observacoes ? `<div class="campo"><small>Observações</small><div class="obs">${esc(c.observacoes)}</div></div>` : ""}

    <div class="secao">
      <h3>Documentos</h3>
      ${docs || '<p class="vazio">Nenhum documento anexado.</p>'}
    </div>

    <div class="secao">
      <h3>Linha do Tempo</h3>
      <div class="novo-comentario">
        <select id="tipoInteracao">
          <option value="whatsapp">WhatsApp</option><option value="ligacao">Ligação</option>
          <option value="email">E-mail</option><option value="presencial">Presencial</option>
        </select>
        <input id="responsavel" placeholder="Responsável">
        <textarea id="novoComentario" rows="3" placeholder="O que foi conversado?"></textarea>
        <button onclick="adicionarComentario()">Adicionar à linha do tempo</button>
      </div>
      <div id="timelineArea"></div>
    </div>`;
  renderizarTimeline(c);
};

window.fecharCliente = () => { location.hash = "clientes"; };

window.adicionarComentario = async () => {
  const texto = $("novoComentario").value.trim();
  if (!texto || !clienteAtualId) return;
  const agora = new Date();
  try {
    await updateDoc(doc(db, "clientes", clienteAtualId), {
      timeline: arrayUnion({
        tipo: $("tipoInteracao").value,
        responsavel: $("responsavel").value,
        comentario: texto,
        data: agora.toLocaleDateString("pt-BR"),
        hora: agora.toLocaleTimeString("pt-BR")
      })
    });
    $("novoComentario").value = "";
  } catch (e) { alert("Erro ao salvar comentário: " + e.message); }
};

function renderizarTimeline(c) {
  const area = $("timelineArea");
  if (!area) return;
  area.innerHTML = (c.timeline || []).slice().reverse().map(i => `
    <div class="timeline-item timeline-${esc(i.tipo)}">
      <div class="meta">
        <span><span class="tipo">${tipos[i.tipo] || esc(i.tipo)}</span>${i.responsavel ? " · " + esc(i.responsavel) : ""}</span>
        <span>${esc(i.data)} às ${esc(i.hora)}</span>
      </div>
      ${esc(i.comentario)}
    </div>`).join("") || '<p class="vazio">Nenhuma interação registrada.</p>';
}
rota();
</script>
</body>
</html>
